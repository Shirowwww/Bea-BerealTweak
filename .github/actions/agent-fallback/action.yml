name: "Agent fallback (Copilot then Claude)"
description: >-
  Tries Copilot, then Claude (Sonnet 5) if Copilot doesn't help, to resolve
  a merge conflict or failing CI check on an upstream-sync PR's auto/*
  branch. Runs at most once per branch tip (the agent-attempted label) - see
  SYNCING.md for the full policy and AGENTS.md for the rules baked into the
  prompt. Claude runs as a direct step here (not via an @claude PR comment)
  because a comment posted with GH_TOKEN would never trigger another
  Actions workflow - see https://docs.github.com/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow.
  Copilot doesn't have that problem since it isn't an Actions workflow, so
  it's still invoked the normal way (an @copilot PR comment).

inputs:
  mode:
    description: "conflict or ci-fix"
    required: true
  pr-number:
    required: true
  branch:
    description: "auto/* branch name"
    required: true
  fork-repo:
    required: true
  fork-branch:
    required: true
  anthropic-api-key:
    required: true
  gh-token:
    required: true
  copilot-timeout-seconds:
    default: "600"
  poll-interval-seconds:
    default: "20"

outputs:
  resolved:
    description: "true if either agent pushed a fix commit (or one was already in flight)"
    value: ${{ steps.summarize.outputs.resolved }}

runs:
  using: composite
  steps:
    - id: guard
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        gh label create "agent-attempted" --color "5319e7" \
          --description "An AI fallback agent already tried to resolve this once" --force >/dev/null 2>&1 || true
        LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
        if echo "$LABELS" | grep -qx "agent-attempted"; then
          echo "PR #$PR_NUMBER already has agent-attempted - not retrying automatically."
          echo "already=true" >> "$GITHUB_OUTPUT"
        else
          echo "already=false" >> "$GITHUB_OUTPUT"
          gh pr edit "$PR_NUMBER" --add-label "agent-attempted"
        fi

    - id: prompt
      if: steps.guard.outputs.already == 'false'
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        PR_NUMBER: ${{ inputs.pr-number }}
        BRANCH: ${{ inputs.branch }}
        FORK_REPO: ${{ inputs.fork-repo }}
        FORK_BRANCH: ${{ inputs.fork-branch }}
      run: |
        {
          echo 'task<<AGENT_PROMPT_EOF'
          bash "${{ github.action_path }}/../../scripts/agent-prompt.sh" "$MODE" "$PR_NUMBER" "$BRANCH" "$FORK_REPO" "$FORK_BRANCH"
          echo 'AGENT_PROMPT_EOF'
        } >> "$GITHUB_OUTPUT"

    - id: copilot
      if: steps.guard.outputs.already == 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        BRANCH: ${{ inputs.branch }}
        TASK: ${{ steps.prompt.outputs.task }}
        TIMEOUT_S: ${{ inputs.copilot-timeout-seconds }}
        POLL_S: ${{ inputs.poll-interval-seconds }}
      run: |
        BEFORE=$(gh api "repos/{owner}/{repo}/git/ref/heads/${BRANCH}" --jq '.object.sha')
        gh pr comment "$PR_NUMBER" --body "@copilot
        ${TASK}"
        WAITED=0
        RESOLVED=false
        while [ "$WAITED" -lt "$TIMEOUT_S" ]; do
          sleep "$POLL_S"
          WAITED=$((WAITED + POLL_S))
          NOW=$(gh api "repos/{owner}/{repo}/git/ref/heads/${BRANCH}" --jq '.object.sha' 2>/dev/null || echo "$BEFORE")
          if [ "$NOW" != "$BEFORE" ]; then
            echo "Copilot pushed a new commit after ${WAITED}s."
            RESOLVED=true
            break
          fi
        done
        if [ "$RESOLVED" = "false" ]; then
          echo "Copilot did not push anything within ${TIMEOUT_S}s (not enabled, or declined) - falling back to Claude."
        fi
        echo "resolved=$RESOLVED" >> "$GITHUB_OUTPUT"

    - name: Checkout branch for Claude
      if: steps.guard.outputs.already == 'false' && steps.copilot.outputs.resolved == 'false'
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
      run: |
        git fetch origin "$BRANCH"
        git checkout "$BRANCH"

    - name: Run Claude Code
      if: steps.guard.outputs.already == 'false' && steps.copilot.outputs.resolved == 'false'
      # A missing ANTHROPIC_API_KEY or any other failure here should fall
      # through to the needs-manual-adaptation path below, not hard-fail
      # the whole job - the next step just won't find anything to push.
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        prompt: ${{ steps.prompt.outputs.task }}
        claude_args: |
          --model claude-sonnet-5

    - id: claude-push
      if: steps.guard.outputs.already == 'false' && steps.copilot.outputs.resolved == 'false'
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        MODE: ${{ inputs.mode }}
      run: |
        git config user.name "sync-forks[bot]"
        git config user.email "actions@github.com"
        if [ -n "$(git status --porcelain)" ]; then
          git add -A
          git commit -m "Agent fix (Claude, Sonnet 5): ${MODE}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
        else
          echo "Claude made no changes."
          echo "pushed=false" >> "$GITHUB_OUTPUT"
        fi

    - id: summarize
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        ALREADY: ${{ steps.guard.outputs.already }}
        COPILOT_RESOLVED: ${{ steps.copilot.outputs.resolved }}
        CLAUDE_PUSHED: ${{ steps.claude-push.outputs.pushed }}
      run: |
        if [ "$ALREADY" = "true" ]; then
          echo "resolved=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$COPILOT_RESOLVED" = "true" ] || [ "$CLAUDE_PUSHED" = "true" ]; then
          echo "resolved=true" >> "$GITHUB_OUTPUT"
        else
          echo "resolved=false" >> "$GITHUB_OUTPUT"
          gh pr edit "$PR_NUMBER" --add-label "needs-manual-adaptation"
          gh pr comment "$PR_NUMBER" --body ":warning: Both automated fallbacks (@copilot then Claude) were tried on this PR and neither produced a fix. This needs a human - see \`SYNCING.md\`. A new commit from the upstream fork will reset this and try again."
        fi

name: sync-forks

# Mirrors NikoloziKhachiashvili/MiniBea and tqmane/MiniBea into this repo's
# sync/nikolozi and sync/tqmane branches (pure, never hand-edited mirrors),
# and opens/refreshes a PR from a derived auto/* working branch into main
# when the upstream fork actually moved. If the merge is clean, enables
# GitHub's native auto-merge (gated on the build + invariants required
# checks); if not, asks Copilot then Claude (./.github/actions/agent-fallback)
# to resolve it. Never runs any code checked out from either fork - see
# SYNCING.md for the full policy.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

env:
  NIKOLOZI_REPO: NikoloziKhachiashvili/MiniBea
  NIKOLOZI_BRANCH: main
  TQMANE_REPO: tqmane/MiniBea
  TQMANE_BRANCH: main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync-nikolozi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync sync/nikolozi from ${{ env.NIKOLOZI_REPO }}
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORK_REPO: ${{ env.NIKOLOZI_REPO }}
          FORK_BRANCH: ${{ env.NIKOLOZI_BRANCH }}
          SYNC_BRANCH: sync/nikolozi
          PR_TITLE: "sync: update from Nikolozi"
        run: bash .github/scripts/sync-one-fork.sh

      - name: Ask Copilot, then Claude, to resolve the conflict
        id: fallback
        if: steps.sync.outputs.conflicted == 'true'
        uses: ./.github/actions/agent-fallback
        with:
          mode: conflict
          pr-number: ${{ steps.sync.outputs.pr_number }}
          branch: ${{ steps.sync.outputs.auto_branch }}
          fork-repo: ${{ env.NIKOLOZI_REPO }}
          fork-branch: ${{ env.NIKOLOZI_BRANCH }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-check mergeability after an agent fix
        if: steps.sync.outputs.conflicted == 'true' && steps.fallback.outputs.resolved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_BRANCH: ${{ steps.sync.outputs.auto_branch }}
          PR_NUMBER: ${{ steps.sync.outputs.pr_number }}
        run: |
          git fetch origin "$AUTO_BRANCH" main --quiet
          if git merge-tree --write-tree origin/main "origin/${AUTO_BRANCH}" >/tmp/merge-tree-out2.txt 2>&1; then
            echo "Now mergeable - enabling auto-merge."
            gh pr edit "$PR_NUMBER" --remove-label "needs-manual-adaptation" >/dev/null 2>&1 || true
            gh pr merge "$PR_NUMBER" --auto --merge
          else
            gh pr edit "$PR_NUMBER" --add-label "needs-manual-adaptation"
            gh pr comment "$PR_NUMBER" --body ":warning: The agent pushed a commit, but this branch still doesn't merge cleanly into \`main\`. Leaving this for a human - see \`SYNCING.md\`."
          fi

      - name: Enable auto-merge
        if: steps.sync.outputs.conflicted == 'false' && steps.sync.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.sync.outputs.pr_number }}" --auto --merge

  sync-tqmane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync sync/tqmane from ${{ env.TQMANE_REPO }}
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORK_REPO: ${{ env.TQMANE_REPO }}
          FORK_BRANCH: ${{ env.TQMANE_BRANCH }}
          SYNC_BRANCH: sync/tqmane
          PR_TITLE: "sync: update from tqmane"
        run: bash .github/scripts/sync-one-fork.sh

      - name: Ask Copilot, then Claude, to resolve the conflict
        id: fallback
        if: steps.sync.outputs.conflicted == 'true'
        uses: ./.github/actions/agent-fallback
        with:
          mode: conflict
          pr-number: ${{ steps.sync.outputs.pr_number }}
          branch: ${{ steps.sync.outputs.auto_branch }}
          fork-repo: ${{ env.TQMANE_REPO }}
          fork-branch: ${{ env.TQMANE_BRANCH }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-check mergeability after an agent fix
        if: steps.sync.outputs.conflicted == 'true' && steps.fallback.outputs.resolved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_BRANCH: ${{ steps.sync.outputs.auto_branch }}
          PR_NUMBER: ${{ steps.sync.outputs.pr_number }}
        run: |
          git fetch origin "$AUTO_BRANCH" main --quiet
          if git merge-tree --write-tree origin/main "origin/${AUTO_BRANCH}" >/tmp/merge-tree-out2.txt 2>&1; then
            echo "Now mergeable - enabling auto-merge."
            gh pr edit "$PR_NUMBER" --remove-label "needs-manual-adaptation" >/dev/null 2>&1 || true
            gh pr merge "$PR_NUMBER" --auto --merge
          else
            gh pr edit "$PR_NUMBER" --add-label "needs-manual-adaptation"
            gh pr comment "$PR_NUMBER" --body ":warning: The agent pushed a commit, but this branch still doesn't merge cleanly into \`main\`. Leaving this for a human - see \`SYNCING.md\`."
          fi

      - name: Enable auto-merge
        if: steps.sync.outputs.conflicted == 'false' && steps.sync.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.sync.outputs.pr_number }}" --auto --merge

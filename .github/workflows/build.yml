name: Build

on:
  push:
    # sync/* is a pure mirror branch (see SYNCING.md), never built directly -
    # everything else (main, auto/*, ordinary feature branches) still is.
    branches-ignore: ["sync/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # This repo can't be compiled on the Windows dev machine, so CI is the
    # only place that verifies it builds. Runs on macOS: theos-action's Linux
    # path fetches a prebuilt toolchain from kabiroberai/swift-toolchain-linux
    # v2.1.0, which only publishes ubuntu18.04/20.04 assets - ubuntu-latest is
    # now 24.04, so that download 404s. The repo is public, so Actions
    # minutes are free on macOS runners too.
    runs-on: macos-latest
    env:
      # Disables fakeroot for the dpkg-deb packaging step - tqmane's fork
      # found this necessary on arm64e (Apple Silicon) runners, where
      # fakeroot itself can fail to exec under Rosetta-less environments.
      # Harmless if unneeded.
      FAKEROOT: ""
    steps:
      - uses: actions/checkout@v4

      # Sets THEOS in $GITHUB_ENV for later steps. Uses the default theos/sdks
      # source (small, fast) - it only goes up to 16.5 though, so the missing
      # iPhoneOS18.0.sdk is fetched separately below.
      # https://github.com/beerpiss/theos-action, pinned to the v1.7.0 tag's commit
      - name: Prepare Theos
        uses: beerpiss/theos-action@e27e8335ec3777c2daabedec89a9178b1d4e70c0 # v1.7.0

      # The Makefile targets iPhoneOS18.0.sdk (TARGET := iphone:clang:18.0:14.0).
      # xybp888/iOS-SDKs mirrors it, but the repo bundles ~40 SDK versions
      # (9.3 through 26.5) with no way to download just one - a plain archive
      # fetch (as theos-action's theos-sdks input does) pulls everything and
      # takes 10+ minutes. A partial/sparse clone fetches only the blobs for
      # the one folder we need, pinned to a commit for the same reason as the
      # action above.
      - name: Fetch iPhoneOS18.0 SDK
        run: |
          git clone --filter=blob:none --sparse --no-checkout https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
          cd /tmp/ios-sdks
          git sparse-checkout set iPhoneOS18.0.sdk
          git checkout 1b92ff4a8928f582876e1d388d1381c6a0c59eb9
          mkdir -p "$THEOS/sdks"
          cp -R iPhoneOS18.0.sdk "$THEOS/sdks/"

      - name: Build jailed package (sideload-injectable)
        run: |
          rm -f packages/*.deb
          make clean package FINALPACKAGE=1 JAILED=1

      - name: Rename jailed deb
        run: |
          JAILED_DEB_FILE=$(find ./packages -name "*.deb" -type f)
          if [ -n "$JAILED_DEB_FILE" ]; then
            mv "$JAILED_DEB_FILE" "${JAILED_DEB_FILE%.deb}_jailed.deb"
          else
            echo "::error::No jailed .deb produced"
            exit 1
          fi

      - name: Build rootful package
        run: make clean package FINALPACKAGE=1

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: minibea-packages
          path: packages/*.deb
          if-no-files-found: error
